<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0b4a6f" />
    <title>SafeKaki — Scam help for everyone</title>
    <meta name="description" content="Check suspicious messages, get help, and prepare scam reports. Understands Singlish." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      #boot{font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center;
            background:#0b4a6f;color:#fff;padding:24px;font-size:20px;line-height:1.5}
      #boot code{background:rgba(255,255,255,.15);padding:2px 8px;border-radius:6px}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><div>
        <div style="font-size:64px">🛡️</div>
        <h1>SafeKaki</h1>
        <p id="boot-msg">Loading…</p>
      </div></div>
    </div>
    <noscript><p style="padding:24px;font-size:20px">Please turn on JavaScript to use SafeKaki.</p></noscript>
    <script>
      // Helpful message instead of a blank page.
      var m = document.getElementById('boot-msg');
      if (location.protocol === 'file:') {
        m.innerHTML = 'This page cannot be opened by double-clicking.<br>Open a terminal in this folder and run:<br><br>' +
          '<code>npm install</code> then <code>npm run dev</code><br><br>Then open <code>http://127.0.0.1:5173</code>';
      }
      // If the app has not started after 3 seconds, say why (e.g. Live Server serving the source folder).
      setTimeout(function () {
        var b = document.getElementById('boot-msg');
        if (b && document.getElementById('boot')) {
          b.innerHTML = 'The app did not start.<br><br>This usually means the page is being opened with <b>Live Server</b> or <b>Simple Browser</b>, which cannot run this project\'s source files.<br><br>' +
            'Fix: open a terminal in this folder and run <code>npm install</code> then <code>npm run dev</code>,<br>' +
            'then open <code>http://localhost:5173</code><br><br>' +
            'Or: right-click <code>dist/index.html</code> and choose <b>Open with Live Server</b>.';
        }
      }, 3000);
      window.addEventListener('error', function (e) {
        var b = document.getElementById('boot-msg');
        if (b) b.textContent = 'Something went wrong: ' + e.message;
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
